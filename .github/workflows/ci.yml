name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every run mutates the balance of one shared remote test user, so runs must never overlap.
concurrency:
  group: live-test-user
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: API & UI tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      USER_ID: ${{ secrets.USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --junitxml=reports/junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14
