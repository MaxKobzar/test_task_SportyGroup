name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every run mutates the balance of one shared remote test user, so runs must never overlap.
concurrency:
  group: live-test-user
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"
  ALLURE_VERSION: "2.46.1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating major tags published)
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: API & UI tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages-report: ${{ steps.stage-pages.outcome }}
    env:
      CI: "true"
      USER_ID: ${{ secrets.USER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating major tags published)
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --junitxml=reports/junit.xml

      # The report is built even when tests fail: that is when it is needed most.
      - uses: actions/setup-java@v6
        if: ${{ !cancelled() && hashFiles('reports/allure-results/*') != '' }}
        with:
          distribution: temurin
          java-version: "21"
      - name: Generate Allure report
        if: ${{ !cancelled() && hashFiles('reports/allure-results/*') != '' }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          # --single-file inlines all assets, so index.html opens straight from the downloaded artifact.
          "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin/allure" generate reports/allure-results \
            --clean --single-file --report-name "Sporty QA - run ${GITHUB_RUN_NUMBER}" \
            --output reports/allure-report

      - name: Upload Allure HTML report
        if: ${{ !cancelled() && hashFiles('reports/allure-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports/allure-report/index.html
          retention-days: 14
      - name: Stage Allure report for GitHub Pages
        id: stage-pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('reports/allure-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report
      - name: Upload raw test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            reports/junit.xml
            reports/allure-results/
          retention-days: 14

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: tests
    # Runs on main only, and also when tests fail (that report matters most), as long as one was built.
    if: ${{ !cancelled() && needs.tests.outputs.pages-report == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
