[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config --alluredir=reports/allure-results --clean-alluredir
xfail_strict = true

# Live logging (single source of truth for CLI, IDE and CI runs; override with --log-cli-level)
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] [%(name)s] : %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli_format = %(asctime)s [%(levelname)s] [%(name)s] : %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

markers =
    ui: mark test as UI test requiring Selenium WebDriver
    api: mark test as API test
    smoke: mark test as smoke test
