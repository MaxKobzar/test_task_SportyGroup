[tool.poetry]
name = "sporty-qa-framework"
version = "0.1.0"
description = "Hybrid UI (Selenium + Screenplay & POM) and API Test Automation Framework"
authors = ["QA Automation Engineer <qa@example.com>"]
readme = "README.md"
packages = [{include = "framework"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
selenium = "^4.20.0"
requests = "^2.31.0"
pydantic = "^2.0.0"
pytest = "^8.0.0"
allure-pytest = "^2.13.0"
assertpy = "^2.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined variables)
    "I",    # isort (import sorting)
    "PT",   # flake8-pytest-style (pytest standards)
    "T10",  # debugger calls (breakpoint, pdb)
    "T20",  # print statements
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except (prohibits blind except Exception)
    "G",    # flake8-logging-format (lazy %-style logging, no f-strings)
    "LOG",  # flake8-logging (logging.getLogger(__name__) usage)
    "UP",   # pyupgrade (PEP 604/585 typing for the target Python)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
ignore = [
    "PT009", # Allow assertpy / custom assertions alongside standard asserts
    "E501",  # Line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# The framework is a library: every public function is typed.
module = "framework.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["allure.*", "allure_commons.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "types-requests (>=2.33.0.20261030,<3.0.0.0)"
]
